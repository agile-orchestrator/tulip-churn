[project]
name = "tulip-churn"
version = "0.1.0"
description = "Tulip Bank churn early-warning model and scoring API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2.13",
    "ruff>=0.6",
    "jupyter>=1.1",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "slopguard",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tulip_churn"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks", "vulture_whitelist.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
slopguard = { git = "https://github.com/kimzed/python-slopguard" }

[tool.slopguard]
exclude = ["notebooks/*"]
allow_suppression_comments = false
max_findings = 10
on_missing_tool = "error"
instructions_to_claude_on_block = "Fix by refactoring: split long or branchy functions into small named helpers in the same module, and group many arguments into a dataclass. Never add # noqa. If you find no satisfactory way to refactor, stop and discuss a plan and possible approaches with the engineer instead of forcing a fix."

[tool.slopguard.edit]
enabled = true
max_complexity = 4
max_args = 4
max_positional_args = 4
max_statements = 15
max_nested_blocks = 3
max_file_lines = 400
max_annotation_depth = 3
max_annotation_elements = 3
max_return_tuple = 2
existing_violations = "block"
exclude = ["scripts/*"]

[tool.slopguard.dead_code]
enabled = true
paths = ["src", "scripts", "tests"]
min_confidence = 60
ignore_decorators = ["@app.*", "@pytest.fixture"]
ignore_names = []
whitelist = "vulture_whitelist.py"

[tool.slopguard.duplication]
enabled = true
paths = ["src", "tests", "scripts"]
min_tokens = 50
min_occurrences = 4
exclude = []
