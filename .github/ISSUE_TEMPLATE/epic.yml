name: Epic
description: A large business outcome that spans several features and sprints.
title: "[Epic] "
labels: [epic]
type: Epic
body:
  - type: textarea
    id: outcome
    attributes:
      label: Business outcome
      description: What changes for the bank or the customer when this is done?
    validations:
      required: true
  - type: textarea
    id: stakeholders
    attributes:
      label: Stakeholders
  - type: textarea
    id: success
    attributes:
      label: Success metrics
      description: How will we measure it?
  - type: textarea
    id: scope
    attributes:
      label: In scope / out of scope
  - type: input
    id: wiki
    attributes:
      label: Wiki link
      description: Link to the source meeting notes or spec on the wiki.
